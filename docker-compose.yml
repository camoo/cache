services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  tests:
    build:
      context: .
      dockerfile: Dockerfile.redis-test
    working_dir: /app
    volumes:
      - .:/app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "15"
    depends_on:
      redis:
        condition: service_healthy
    command: ["vendor/bin/phpunit", "--configuration", "phpunit.xml.dist"]

